<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>송촌중학교 일정</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- 학교 로고와 제목 -->

    <header class="school-header">

    <img

        src="./school-logo.png"

        alt="송촌중학교 로고"

        class="school-logo"

    >

    <div class="school-title-wrap">

        <span class="school-subtitle">SONGCHON MIDDLE SCHOOL</span>

        <h1>송촌중 달력</h1>

        <p>우리 학교의 소식을 한눈에</p>

    </div>

</header>

    <!-- 달력 이동 -->

    <div class="top-bar">

        <button id="prevMonth" type="button">◀</button>

        <h2 id="monthTitle"></h2>

        <button id="nextMonth" type="button">▶</button>

    </div>

    <!-- 일정 검색 -->

    <div class="search-box">

        <input type="text" id="searchInput" placeholder="일정 검색">

        <button id="searchBtn" type="button">검색</button>

    </div>

    <!-- 요일 -->

    <div class="weekdays">

        <div>일</div>

        <div>월</div>

        <div>화</div>

        <div>수</div>

        <div>목</div>

        <div>금</div>

        <div>토</div>

    </div>

    <!-- 달력 -->

    <div id="calendar"></div>

    <button id="addScheduleBtn" type="button">

        일정 등록

    </button>

    <!-- 오늘의 일정 -->

    <section class="schedule-section">

        <div class="section-heading">

            <div>

                <span class="section-label">TODAY</span>

                <h2>오늘의 일정</h2>

            </div>

            <span class="section-icon mint-icon">▦</span>

        </div>

        <div id="todaySchedules" class="schedule-list">

            <p class="empty-schedule">오늘 등록된 일정이 없어요.</p>

        </div>

    </section>

    <!-- 급식과 최근 일정을 나란히 배치 -->

<div class="bottom-sections">

    <!-- 오늘의 급식 -->

    <section class="schedule-section lunch-section">
                <div class="section-heading meal-heading">

            <div class="meal-title">

                <span class="section-label">TODAY'S MEAL</span>

                <h2>오늘의 급식</h2>

            </div>

            <div class="meal-heading-right">

                <p id="mealInfo" class="meal-date"></p>

                <span class="section-icon mint-icon">🍚</span>

            </div>

        </div>

        <div id="mealMenu" class="schedule-list">

            <p class="empty-schedule">급식 메뉴를 불러오는 중이에요.</p>

        </div>

    </section>

    <!-- 최근 일정 -->

    <section class="schedule-section">

        <div class="section-heading">

            <div>

                <span class="section-label">UPCOMING</span>

                <h2>최근 일정</h2>

            </div>

            <span class="section-icon blue-icon">▤</span>

        </div>

        <div id="recentSchedules" class="schedule-list">

            <p class="empty-schedule">일정을 불러오는 중이에요.</p>

        </div>

    </section>
</div>
</div>

<!-- 학생회 인증 -->

<div class="popup" id="passwordPopup">

    <div class="popup-box">

        <h2>학생회 인증</h2>

        <input type="password" id="passwordInput" placeholder="비밀번호">

        <button id="checkPassword" type="button">확인</button>

        <button id="closePassword" type="button">닫기</button>

    </div>

</div>

<!-- 일정 등록 및 수정 -->

<div class="popup" id="schedulePopup">

    <div class="popup-box">

        <h2>일정 등록</h2>

        <label for="titleInput">제목</label>

        <input type="text" id="titleInput">

        <label for="typeInput">종류</label>

        <select id="typeInput">

            <option value="방송">방송</option>

            <option value="행사">행사</option>

            <option value="공휴일">공휴일</option>

            <option value="동아리">동아리</option>

            <option value="학급회의">학급회의</option>

            <option value="시험">시험</option>

            <option value="체험학습">체험학습</option>

            <option value="방학">방학</option>

            <option value="기타">기타</option>

        </select>

        <label for="startDateInput">시작 날짜</label>

        <input type="date" id="startDateInput">

        <label for="endDateInput">종료 날짜</label>

        <input type="date" id="endDateInput">

        <label for="placeInput">장소</label>

        <input type="text" id="placeInput">

        <label for="contentInput">내용</label>

        <textarea id="contentInput"></textarea>

        <label for="imageInput">사진</label>

        <input type="file" id="imageInput">

        <button id="saveSchedule" type="button">등록</button>

        <button id="closeSchedule" type="button">닫기</button>

    </div>

</div>

<!-- 일정 상세 보기 -->

<div class="popup" id="viewPopup">

    <div class="popup-box">

        <button class="close-btn" id="closeView"

            type="button" aria-label="닫기">×</button>

        <h2 id="viewTitle"></h2>

        <div class="event-navigation">

            <button id="prevEvent" type="button" aria-label="이전 일정">&lt;</button>

            <span id="eventCount">1 / 1</span>

            <button id="nextEvent" type="button" aria-label="다음 일정">&gt;</button>

        </div>

        <div class="detail-row">

            <div class="detail-icon calendar-icon">

                <svg viewBox="0 0 24 24" aria-hidden="true">

                    <rect x="3.5" y="5" width="17" height="16" rx="3"></rect>

                    <path d="M7.5 3v4M16.5 3v4M3.5 10h17"></path>

                </svg>

            </div>

            <p id="viewDate"></p>

        </div>

        <div class="detail-row">

            <div class="detail-icon place-icon">

                <svg viewBox="0 0 24 24" aria-hidden="true">

                    <path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"></path>

                    <circle cx="12" cy="10" r="2.5"></circle>

                </svg>

            </div>

            <p id="viewPlace"></p>

        </div>

        <div class="detail-row">

            <div class="detail-icon type-icon">

                <svg viewBox="0 0 24 24" aria-hidden="true">

                    <path d="M5 4.5h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2Z"></path>

                    <path d="M8 9h8M8 13h8"></path>

                </svg>

            </div>

            <p id="viewType"></p>

        </div>

        <img id="viewImage" alt="일정 이미지">

        <div class="info-box">

            <p id="viewContent"></p>

        </div>

        <div class="popup-buttons">

            <div class="button-row">

                <button id="editBtn" type="button">수정</button>

                <button id="deleteBtn" type="button">삭제</button>

            </div>

        </div>

    </div>

</div>

<script type="module" src="script.js"></script>

</body>

</html>
