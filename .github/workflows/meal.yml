name: Update school meals

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  update-meals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch NEIS meal data
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          OFFICE_CODE: "교육청코드"
          SCHOOL_CODE: "학교코드"
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          date = datetime.now(ZoneInfo("Asia/Seoul")).strftime("%Y%m%d")

          params = {
              "KEY": os.environ["NEIS_API_KEY"],
              "Type": "json",
              "ATPT_OFCDC_SC_CODE": os.environ["OFFICE_CODE"],
              "SD_SCHUL_CODE": os.environ["SCHOOL_CODE"],
              "MLSV_YMD": date
          }

          url = (
              "https://open.neis.go.kr/hub/mealServiceDietInfo?"
              + urllib.parse.urlencode(params)
          )

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "SchoolSchedule"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          rows = data.get("mealServiceDietInfo", [])
          meals = []

          if len(rows) > 1:
              for row in rows[1].get("row", []):
                  meals.append({
                      "name": row.get("MMEAL_SC_NM", ""),
                      "menu": row.get("DDISH_NM", ""),
                      "calories": row.get("CAL_INFO", "")
                  })

          result = {"date": date, "meals": meals}

          with open("meal.json", "w", encoding="utf-8") as file:
              json.dump(result, file, ensure_ascii=False, indent=2)

          print("급식 데이터 파일 생성 완료")
          PY

      - name: Commit meal data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meal.json
          git diff --cached --quiet || git commit -m "Update school meal data"
          git push
